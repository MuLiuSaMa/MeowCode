<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeowCode</title>
    <style>
      /* 启动画面之前也保持黑底，避免首帧白闪；App 就绪后移除 data-booting */
      html[data-booting],
      html[data-booting] body {
        background: #000;
      }
    </style>
    <script>
      // 防启动闪色：在样式与 React 之前就把 data-theme 定下来。
      // key 必须与 src/theme/theme.tsx 的 STORAGE_KEY 一致。
      (function () {
        document.documentElement.dataset.booting = "1";
        try {
          var stored = localStorage.getItem("meow:theme");
          var resolved =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = resolved;
          // 配色（与明暗正交）：必须与主题在同一帧写下去，否则会先按经典色画一帧。
          // key 与 src/theme/theme.tsx 的 PALETTE_STORAGE_KEY 一致，白名单与 api.ts 的 ThemePalette 一致。
          var palettes = ["classic", "lava", "bee", "mint", "parchment", "harmony"];
          var palette = localStorage.getItem("meow:palette");
          document.documentElement.dataset.palette =
            palette && palettes.indexOf(palette) >= 0 ? palette : "classic";
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.palette = "classic";
        }
        // 界面语言同理：异步 settings 要等 IPC，首帧前只能读 localStorage 镜像。
        // key 与 src/i18n/index.ts 的 LANGUAGE_STORAGE_KEY 一致，判定规则也与 languages.ts 对齐。
        try {
          var stored = localStorage.getItem("meow:language");
          var supported = ["zh-CN", "zh-TW", "en", "ja", "ko", "ru", "de", "fr", "es", "pt", "hi"];
          var language = stored && supported.indexOf(stored) >= 0 ? stored : null;
          if (!language) {
            var tags = navigator.languages || [navigator.language];
            for (var i = 0; i < tags.length; i += 1) {
              var tag = String(tags[i] || "").toLowerCase();
              if (tag.indexOf("zh") === 0) {
                language = /tw|hk|mo|hant/.test(tag) ? "zh-TW" : "zh-CN";
                break;
              }
              var base = tag.split("-")[0];
              if (supported.indexOf(base) >= 0) {
                language = base;
                break;
              }
            }
          }
          document.documentElement.lang = language || "zh-CN";
        } catch (error) {
          document.documentElement.lang = "zh-CN";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
